<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyDiary</title>
<style>
  :root { color-scheme: light dark; --ink:#2a2620; --muted:#6b6355; --paper:#f8f4e9; }
  @media (prefers-color-scheme: dark) { :root { --ink:#f0e9da; --muted:#b0a795; --paper:#1a1714; } }
  body { margin:0; background:var(--paper); color:var(--ink); font-family: -apple-system, "Hiragino Sans", system-ui, sans-serif; line-height:1.8; }
  main { max-width: 680px; margin: 0 auto; padding: 48px 20px; }
  h1 { font-size: 28px; margin: 0 0 8px; }
  p.lead { color: var(--muted); margin-top: 0; }
  a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>MyDiary</h1>
  <p class="lead">iPad 用の個人の手帳アプリ</p>
  <p>MyDiary は、作者が自分の iPad で使うために作った手帳アプリです。App Store などでは配布していません。</p>
  <p>Google カレンダーの予定を月・週・年の形で表示・編集し、Apple Pencil で手書きのノートを書けます。</p>
  <p><a href="privacy.html">プライバシーポリシー</a></p>
</main>
</body>
</html>
